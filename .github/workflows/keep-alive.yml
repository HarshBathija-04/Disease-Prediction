name: Keep alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping backend /health (also exercises the database)
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "::notice::BACKEND_URL repository variable is not set; skipping."
            exit 0
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 20 --retry-all-errors --max-time 90 "${BACKEND_URL%/}/health"
