<!DOCTYPE html>
<html>
<head>
    <title>Book Appointment</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-4">
    <h3>Book Appointment</h3>
    <form method="post" class="card p-3 bg-white">
        {% csrf_token %}
        <div class="form-group">
            <label>Doctor</label>
            <select name="doctor_id" class="form-control" required>
                <option value="">Select doctor</option>
                {% for d in doctors %}
                    <option value="{{ d.id }}">Dr. {{ d.name }} ({{ d.specialization }})</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Appointment Date</label>
            <input type="date" min="{{ today|date:'Y-m-d' }}" name="appointment_date" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Related Prediction (Optional)</label>
            <select name="prediction_id" class="form-control">
                <option value="">None</option>
                {% for p in predictions %}
                    <option value="{{ p.id }}">{{ p.disease_name }} ({{ p.created_at }})</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Book</button>
    </form>
</div>
</body>
</html>
