

{% extends "basic.html" %}
{% load static %}

{% block head %}
<style>
  .signin-page {
    min-height: calc(100vh - 70px);
    background: linear-gradient(135deg, #f0f4f8 0%, #e8f0fe 50%, #e0f7f5 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  .signin-card {
    background: white;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.1);
    padding: 3rem 2.5rem;
    width: 100%;
    max-width: 440px;
    animation: fadeInUp 0.6s ease;
  }

  .signin-card h2 {
    font-family: 'Outfit', sans-serif;
    font-weight: 700;
    font-size: 1.8rem;
    text-align: center;
    color: var(--text-dark);
    margin-bottom: 0.3rem;
  }

  .signin-card .subtitle {
    text-align: center;
    color: var(--text-muted);
    font-size: 0.9rem;
    margin-bottom: 2rem;
  }

  .form-group-modern {
    margin-bottom: 1.2rem;
  }

  .form-group-modern label {
    font-weight: 600;
    font-size: 0.85rem;
    color: var(--text-dark);
    margin-bottom: 0.4rem;
    display: block;
  }

  .form-group-modern input {
    width: 100%;
    padding: 0.75rem 1rem;
    border: 2px solid #e0e6ed;
    border-radius: 12px;
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    transition: all 0.3s ease;
    outline: none;
  }

  .form-group-modern input:focus {
    border-color: var(--primary-teal);
    box-shadow: 0 0 0 4px rgba(26, 138, 125, 0.1);
  }

  .form-group-modern input::placeholder {
    color: #aab;
  }

  .forgot-link {
    text-align: right;
    margin-bottom: 1.5rem;
  }

  .forgot-link a {
    color: var(--primary-teal);
    font-size: 0.85rem;
    font-weight: 500;
    text-decoration: none;
  }

  .forgot-link a:hover {
    text-decoration: underline;
  }

  .btn-signin {
    width: 100%;
    padding: 0.85rem;
    background: linear-gradient(135deg, var(--primary-blue), var(--primary-teal));
    color: white;
    border: none;
    border-radius: 12px;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 6px 25px rgba(15, 43, 60, 0.25);
  }

  .btn-signin:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 35px rgba(15, 43, 60, 0.35);
  }

  .error-messages {
    text-align: center;
    margin-bottom: 1rem;
  }

  .error-messages h3 {
    color: #e74c3c;
    font-size: 0.9rem;
    font-weight: 600;
    background: rgba(231, 76, 60, 0.08);
    padding: 0.6rem 1rem;
    border-radius: 10px;
    border: 1px solid rgba(231, 76, 60, 0.15);
  }

  .signin-footer {
    text-align: center;
    margin-top: 2rem;
    padding-top: 1.5rem;
    border-top: 1px solid #e8ecf1;
  }

  .signin-footer span {
    color: var(--text-muted);
    font-size: 0.9rem;
  }

  .signin-footer a {
    color: var(--primary-teal);
    font-weight: 700;
    text-decoration: none;
  }

  .signin-footer a:hover {
    text-decoration: underline;
  }

  /* Logo accent */
  .signin-logo {
    width: 50px;
    height: 50px;
    background: linear-gradient(135deg, var(--primary-teal), var(--accent-green));
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: 800;
    font-size: 1.5rem;
    font-family: 'Outfit', sans-serif;
    margin: 0 auto 1.5rem;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
{% endblock %}


{% block body %}

<div class="signin-page">
  <div class="signin-card">
    <div class="signin-logo">P</div>
    <h2>Welcome Back</h2>
    <p class="subtitle">Sign in to your patient account</p>

    <form action="sign_in_patient" method="POST">
      {% csrf_token %}

      <div class="form-group-modern">
        <label for="username">Username</label>
        <input type="text" name="username" id="username" placeholder="Enter your username" required>
      </div>

      <div class="form-group-modern">
        <label for="password">Password</label>
        <input type="password" name="password" id="password" placeholder="Enter your password" required>
      </div>

      <div class="forgot-link">
        <a href="#">Forgot password?</a>
      </div>

      <div class="error-messages">
        {% for message in messages %}
          <h3>{{message}}</h3>
        {% endfor %}
      </div>

      <button type="submit" class="btn-signin">Sign In</button>

    </form>

    <div class="signin-footer">
      <span>Don't have an account? </span>
      <a href="signup_patient">Sign Up</a>
    </div>
  </div>
</div>

{% endblock %}
