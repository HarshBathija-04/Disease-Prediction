
{% extends "basic.html" %}
{% load static %}

{% block head %}
<style>
  .profile-page {
    min-height: calc(100vh - 70px);
    background: linear-gradient(135deg, #f0f4f8 0%, #e8f0fe 100%);
    padding: 2.5rem;
    display: flex;
    justify-content: center;
  }

  .profile-form-card {
    background: white;
    border-radius: 20px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.08);
    padding: 2.5rem;
    width: 100%;
    max-width: 600px;
    animation: fadeInUp 0.6s ease;
  }

  .profile-form-card h2 {
    font-family: 'Outfit', sans-serif;
    font-weight: 700;
    font-size: 1.5rem;
    color: var(--text-dark);
    text-align: center;
    margin-bottom: 2rem;
    padding-bottom: 1rem;
    border-bottom: 2px solid #f0f4f8;
  }

  .profile-form-card h2 span {
    color: var(--primary-teal);
  }

  .form-field {
    margin-bottom: 1.2rem;
  }

  .form-field label {
    display: block;
    font-weight: 600;
    font-size: 0.85rem;
    color: var(--text-muted);
    margin-bottom: 0.4rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .form-field input {
    width: 100%;
    padding: 0.7rem 1rem;
    border: 2px solid #e0e6ed;
    border-radius: 10px;
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    color: var(--text-dark);
    transition: all 0.3s ease;
    outline: none;
    background: #fafbfc;
  }

  .form-field input:focus {
    border-color: var(--primary-teal);
    box-shadow: 0 0 0 3px rgba(26, 138, 125, 0.1);
    background: white;
  }

  .profile-actions {
    display: flex;
    gap: 0.8rem;
    margin-top: 1.5rem;
    padding-top: 1.5rem;
    border-top: 2px solid #f0f4f8;
  }

  .btn-edit-profile {
    background: rgba(26, 82, 118, 0.08);
    color: var(--primary-blue);
    border: 2px solid rgba(26, 82, 118, 0.15);
    padding: 0.65rem 2rem;
    border-radius: 10px;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .btn-edit-profile:hover {
    background: var(--primary-blue);
    color: white;
  }

  .btn-save-profile {
    background: linear-gradient(135deg, var(--primary-teal), var(--accent-green));
    color: white;
    border: none;
    padding: 0.65rem 2rem;
    border-radius: 10px;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(26, 138, 125, 0.3);
  }

  .btn-save-profile:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 25px rgba(26, 138, 125, 0.4);
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
{% endblock %}


{% block body %}

<div class="profile-page">
  <div class="profile-form-card">
    <h2>Patient Profile — <span>{{ puser.patient.name }}</span></h2>

    <div class="form-field">
      <label for="id_username">Username</label>
      <input type="text" name="username" value="{{ puser.username }}" maxlength="50" required id="id_username" readonly>
    </div>

    <div class="form-field">
      <label for="id_name">Full Name</label>
      <input type="text" name="name" value="{{ puser.patient.name }}" maxlength="50" required id="id_name">
    </div>

    <div class="form-field">
      <label for="id_email">Email</label>
      <input type="text" name="email" value="{{ puser.email }}" maxlength="100" required id="id_email" readonly>
    </div>

    <div class="form-field">
      <label for="id_dob">Date of Birth</label>
      <input type="text" name="dob" value="{{ puser.patient.dob|date:'Y-m-d' }}" size="10" required id="id_dob">
    </div>

    <div class="form-field">
      <label for="id_address">Address</label>
      <input type="text" name="address" value="{{ puser.patient.address }}" maxlength="100" required id="id_address">
    </div>

    <div class="form-field">
      <label for="id_mobile_no">Mobile Number</label>
      <input type="text" name="mobile_no" value="{{ puser.patient.mobile_no }}" maxlength="15" required id="id_mobile_no">
    </div>

    <div class="form-field">
      <label for="id_gender">Gender</label>
      <input type="text" name="gender" value="{{ puser.patient.gender }}" maxlength="10" required id="id_gender">
    </div>

    {% if request.user.patient %}
    <div class="profile-actions">
      <button type="button" class="btn-edit-profile" data-toggle="collapse" data-target="#save-section">
        <i class="fas fa-edit mr-1"></i> Edit
      </button>
      <div id="save-section" class="collapse">
        <button type="button" id="save" class="btn-save-profile">
          <i class="fas fa-check mr-1"></i> Save Changes
        </button>
      </div>
    </div>
    {% endif %}

  </div>
</div>

<script>
  $(document).ready(function() {
    $('#save').click(function(event) {
      $.ajax({
        url: "{% url 'savepdata' puser.username %}",
        type: "POST",
        data: {
          'csrfmiddlewaretoken': '{{ csrf_token }}',
          "name": document.getElementById('id_name').value,
          "dob": document.getElementById('id_dob').value,
          "gender": document.getElementById('id_gender').value,
          "address": document.getElementById('id_address').value,
          "mobile_no": document.getElementById('id_mobile_no').value
        },
        success: function() {
          alert("Profile saved successfully!");
        }
      });
    });
  });
</script>

{% endblock %}
