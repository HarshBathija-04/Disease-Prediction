{% extends "basic.html" %}
{% load static %}

{% block head %}
<style>
  .signup-page {
    min-height: calc(100vh - 70px);
    background: linear-gradient(135deg, #f0f4f8 0%, #e8f0fe 50%, #e0f7f5 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  .signup-card {
    background: white;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.1);
    padding: 2.5rem;
    width: 100%;
    max-width: 500px;
    animation: fadeInUp 0.6s ease;
  }

  .signup-card h2 {
    font-family: 'Outfit', sans-serif;
    font-weight: 700;
    font-size: 1.6rem;
    text-align: center;
    color: var(--text-dark);
    margin-bottom: 0.3rem;
  }

  .signup-card .subtitle {
    text-align: center;
    color: var(--text-muted);
    font-size: 0.9rem;
    margin-bottom: 2rem;
  }

  .signup-logo {
    width: 50px;
    height: 50px;
    background: linear-gradient(135deg, var(--primary-teal), var(--accent-green));
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: 800;
    font-size: 1.5rem;
    font-family: 'Outfit', sans-serif;
    margin: 0 auto 1.5rem;
  }

  .form-group-modern {
    margin-bottom: 1rem;
  }

  .form-group-modern label {
    font-weight: 600;
    font-size: 0.82rem;
    color: var(--text-muted);
    margin-bottom: 0.3rem;
    display: block;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .form-group-modern input[type="text"],
  .form-group-modern input[type="password"],
  .form-group-modern input[type="number"],
  .form-group-modern input[type="date"],
  .form-group-modern input[type="email"] {
    width: 100%;
    padding: 0.65rem 1rem;
    border: 2px solid #e0e6ed;
    border-radius: 10px;
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    transition: all 0.3s ease;
    outline: none;
  }

  .form-group-modern input:focus {
    border-color: var(--primary-teal);
    box-shadow: 0 0 0 3px rgba(26, 138, 125, 0.1);
  }

  .radio-group {
    display: flex;
    gap: 1rem;
    padding: 0.5rem 0;
  }

  .radio-group label {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-weight: 500;
    font-size: 0.9rem;
    color: var(--text-dark);
    cursor: pointer;
    text-transform: none;
    letter-spacing: 0;
  }

  .radio-group input[type="radio"] {
    accent-color: var(--primary-teal);
  }

  .btn-register {
    width: 100%;
    padding: 0.85rem;
    background: linear-gradient(135deg, var(--primary-blue), var(--primary-teal));
    color: white;
    border: none;
    border-radius: 12px;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 6px 25px rgba(15, 43, 60, 0.25);
    margin-top: 0.5rem;
  }

  .btn-register:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 35px rgba(15, 43, 60, 0.35);
  }

  .error-message {
    background: rgba(231, 76, 60, 0.08);
    border: 1px solid rgba(231, 76, 60, 0.15);
    border-radius: 10px;
    padding: 0.6rem 1rem;
    margin-bottom: 1rem;
    color: #e74c3c;
    font-weight: 600;
    font-size: 0.85rem;
    text-align: center;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
{% endblock %}

{% block body %}

<div class="signup-page">
  <div class="signup-card">
    <div class="signup-logo">P</div>
    <h2>Create Account</h2>
    <p class="subtitle">Sign up as a patient</p>

    {% for message in messages %}
      <div class="error-message">{{message}}</div>
    {% endfor %}

    <form action="signup_patient" method="POST">
      {% csrf_token %}

      <div class="form-group-modern">
        <label>Username</label>
        <input type="text" name="username" placeholder="Choose a username" required>
      </div>

      <div class="form-group-modern">
        <label>Full Name</label>
        <input type="text" name="name" placeholder="Your full name" required>
      </div>

      <div class="form-group-modern">
        <label>Email</label>
        <input type="text" name="email" placeholder="your@email.com" required>
      </div>

      <div class="form-group-modern">
        <label>Date of Birth</label>
        <input type="date" name="dob" required>
      </div>

      <div class="form-group-modern">
        <label>Age</label>
        <input type="number" name="age" placeholder="Your age" required>
      </div>

      <div class="form-group-modern">
        <label>Gender</label>
        <div class="radio-group">
          <label><input type="radio" name="gender" value="male" checked> Male</label>
          <label><input type="radio" name="gender" value="female"> Female</label>
          <label><input type="radio" name="gender" value="other"> Other</label>
        </div>
      </div>

      <div class="form-group-modern">
        <label>Address</label>
        <input type="text" name="address" placeholder="Your address" required>
      </div>

      <div class="form-group-modern">
        <label>Mobile Number</label>
        <input type="number" name="mobile" placeholder="Your mobile number" required>
      </div>

      <div class="form-group-modern">
        <label>Password</label>
        <input type="password" name="password" placeholder="Create a password" required>
      </div>

      <div class="form-group-modern">
        <label>Confirm Password</label>
        <input type="password" name="password1" placeholder="Retype your password" required>
      </div>

      <button type="submit" class="btn-register">
        <i class="fas fa-user-plus mr-2"></i> Create Account
      </button>
    </form>
  </div>
</div>

{% endblock %}
