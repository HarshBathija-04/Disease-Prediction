<!DOCTYPE html>
<html>
<head>
    <title>Assigned Patients</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-4">
    <h3>Assigned Patients</h3>
    <table class="table table-bordered table-striped bg-white">
        <thead><tr><th>Name</th><th>Gender</th><th>Mobile</th></tr></thead>
        <tbody>
        {% for p in patients %}
            <tr><td>{{ p.name }}</td><td>{{ p.gender }}</td><td>{{ p.mobile_no }}</td></tr>
        {% empty %}
            <tr><td colspan="3">No assigned patients.</td></tr>
        {% endfor %}
        </tbody>
    </table>
</div>
</body>
</html>
