<!DOCTYPE html>
<html>
<head>
    <title>Prediction Records</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-4">
    <h3>Prediction Records</h3>
    <table class="table table-bordered table-striped bg-white">
        <thead><tr><th>Date</th><th>Patient</th><th>Disease</th><th>Confidence</th><th>Action</th></tr></thead>
        <tbody>
        {% for item in predictions %}
            <tr>
                <td>{{ item.created_at }}</td>
                <td>{{ item.patient.name }}</td>
                <td>{{ item.disease_name }}</td>
                <td>{{ item.confidence }}%</td>
                <td><a href="{% url 'prediction_detail' item.id %}">View</a></td>
            </tr>
        {% empty %}
            <tr><td colspan="5">No prediction records found.</td></tr>
        {% endfor %}
        </tbody>
    </table>
</div>
</body>
</html>
