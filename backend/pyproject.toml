[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "disease_prediction.settings"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:No directory at:UserWarning"]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["*/migrations/*", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
ignore = ["DJ012"]

[tool.ruff.format]
